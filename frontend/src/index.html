<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>WriteSphere</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=books">
  <script>
    try {
      const theme = localStorage.getItem('writesphere-theme');
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.dataset.theme = theme;
      }
    } catch {
      // The stylesheet follows the system preference when storage is unavailable.
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
