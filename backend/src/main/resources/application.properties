spring.application.name=writesphere
spring.datasource.url=${WRITESPHERE_DB_URL:jdbc:postgresql://127.0.0.1:5432/writesphere}
spring.datasource.username=${WRITESPHERE_DB_USER:writesphere}
spring.datasource.password=${WRITESPHERE_DB_PASSWORD:writesphere}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.address=${WRITESPHERE_BIND_ADDRESS:127.0.0.1}
