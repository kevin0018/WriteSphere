spring.application.name=writesphere
spring.datasource.url=${WRITESPHERE_DB_URL:jdbc:postgresql://127.0.0.1:5432/writesphere}
spring.datasource.username=${WRITESPHERE_DB_USER:writesphere}
spring.datasource.password=${WRITESPHERE_DB_PASSWORD:writesphere}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.address=${WRITESPHERE_BIND_ADDRESS:127.0.0.1}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${WRITESPHERE_SECURE_COOKIE:false}
writesphere.passkeys.rp-id=${WRITESPHERE_PASSKEY_RP_ID:localhost}
writesphere.passkeys.origins=${WRITESPHERE_PASSKEY_ORIGINS:http://localhost:4000,http://localhost:4200}
